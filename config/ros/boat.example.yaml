gnss_node:
  ros__parameters:
    port: /dev/ttyACM2
    baud: 38400
    frame_id: gnss_link
    topic: gnss/fix
    poll_hz: 20.0
    serial_timeout_s: 0.05

imu_node:
  ros__parameters:
    bus: 2
    address: "0x68"
    frame_id: imu_link
    topic: imu/data_raw
    publish_rate_hz: 50.0
    calibrate_on_start: true
    calibration_samples: 200
    calibration_delay_s: 0.01

bno055_node:
  ros__parameters:
    bus: 2
    address: "0x29"
    placement: P1
    # Reset makes startup deterministic but clears volatile calibration.
    reset_on_start: true
    frame_id: imu_link
    # Keep the Bosch device quaternion off the standard fused topic until its
    # mounting and world-frame convention are verified on the installed boat.
    publish_fused_orientation: false
    data_topic: imu/data
    raw_topic: imu/data_raw
    magnetic_field_topic: imu/mag
    temperature_topic: imu/temperature
    linear_acceleration_topic: imu/linear_acceleration
    gravity_topic: imu/gravity
    diagnostics_topic: /diagnostics
    publish_rate_hz: 50.0
    status_rate_hz: 1.0
    # Zero covariance means unknown. Replace these with measured variances
    # before using the BNO055 in a state estimator.
    orientation_variance: [0.0, 0.0, 0.0]
    angular_velocity_variance: [0.0, 0.0, 0.0]
    linear_acceleration_variance: [0.0, 0.0, 0.0]
    magnetic_field_variance: [0.0, 0.0, 0.0]

camera_node:
  ros__parameters:
    device: /dev/mtr_camera
    width: 1280
    height: 720
    fps: 30.0
    frame_id: camera_optical_frame
    topic: /camera/image_raw
    publish_ros: true
    enable_web: true
    web_bind: 0.0.0.0
    web_port: 8081
    web_rotation_deg: 0
    reconnect_delay_s: 2.0

seyond_pointcloud_node:
  ros__parameters:
    lidar_ip: "172.168.1.10"
    lidar_port: 8010
    udp_port: 8010
    frame_id: "lidar_link"
    min_range: 0.15
    max_range: 50.0
    publish_second_return: true
