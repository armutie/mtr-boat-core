gnss_node:
  ros__parameters:
    port: /dev/mtr_gnss
    baud: 38400
    frame_id: gnss_link
    topic: gnss/fix
    velocity_topic: gnss/velocity
    velocity_frame_id: map
    diagnostics_topic: /diagnostics
    diagnostics_rate_hz: 1.0
    poll_hz: 20.0
    serial_timeout_s: 0.05

imu_node:
  ros__parameters:
    bus: 2
    address: "0x68"
    frame_id: imu_link
    topic: imu/data_raw
    publish_rate_hz: 50.0
    calibrate_on_start: true
    calibration_samples: 200
    calibration_delay_s: 0.01

bno055_node:
  ros__parameters:
    bus: 2
    address: "0x29"
    placement: P1
    # Reset makes startup deterministic but clears volatile calibration.
    reset_on_start: true
    frame_id: imu_link
    # The dashboard consumes this fused quaternion. Adjust placement after
    # checking the installed board axes.
    publish_fused_orientation: true
    data_topic: imu/data
    raw_topic: imu/data_raw
    magnetic_field_topic: imu/mag
    temperature_topic: imu/temperature
    linear_acceleration_topic: imu/linear_acceleration
    gravity_topic: imu/gravity
    diagnostics_topic: /diagnostics
    publish_rate_hz: 50.0
    status_rate_hz: 1.0
    # Reinitialize and restore NDOF mode after a transient reset or I2C fault.
    recovery_failure_threshold: 5
    recovery_initial_delay_s: 1.0
    recovery_max_delay_s: 30.0
    # Zero covariance means unknown. Replace these with measured variances
    # before using the BNO055 in a state estimator.
    orientation_variance: [0.0, 0.0, 0.0]
    angular_velocity_variance: [0.0, 0.0, 0.0]
    linear_acceleration_variance: [0.0, 0.0, 0.0]
    magnetic_field_variance: [0.0, 0.0, 0.0]

camera_node:
  ros__parameters:
    device: /dev/mtr_camera
    width: 1280
    height: 720
    fps: 30.0
    frame_id: camera_optical_frame
    topic: /camera/image_raw
    publish_ros: true
    enable_web: true
    web_bind: 0.0.0.0
    web_port: 8081
    web_rotation_deg: 0
    reconnect_delay_s: 2.0

seyond_pointcloud_node:
  ros__parameters:
    lidar_ip: "172.168.1.10"
    lidar_port: 8010
    udp_port: 8010
    frame_id: "lidar_link"
    min_range: 0.15
    max_range: 50.0
    publish_second_return: true

control_supervisor_node:
  ros__parameters:
    operator_topic: cmd_vel/operator
    auto_topic: thrusters/auto
    output_topic: thrusters/command
    mode_request_topic: control/mode_request
    mode_topic: control/mode
    publish_rate_hz: 20.0
    command_timeout_s: 0.5
    max_linear_mps: 1.0
    max_angular_rps: 1.0
    throttle_slew_per_s: 0.5
    neutral_us: 1500
    forward_min_us: 1565
    forward_max_us: 1650
    hard_min_us: 1350
    hard_max_us: 2000

autonomy_node:
  ros__parameters:
    fix_topic: gnss/fix
    velocity_topic: gnss/velocity
    imu_topic: imu/data
    mode_topic: control/mode
    route_topic: autonomy/route
    status_topic: autonomy/status
    command_topic: thrusters/auto
    controller: smooth_pd_v1
    control_hz: 10.0
    min_speed_for_course_mps: 0.08
    gnss_reanchor_speed_mps: 0.3
    gnss_heading_blend: 0.08
    gnss_stale_s: 3.0
    route_match_tolerance_m: 1.0
    imu_stale_s: 2.0
    heading_deadband_deg: 8.0
    yaw_rate_deadband_dps: 2.0
    yaw_lookahead_s: 2.0
    pulse_turn_enter_deg: 18.0
    pulse_turn_exit_deg: 6.0
    pulse_reverse_deg: 38.0
    pulse_duration_s: 0.25
    pulse_observe_s: 0.35
    smooth_kp: 0.025
    smooth_kd: 0.035
    smooth_turn_deadband: 0.08
    smooth_pwm_slew_us_per_s: 300.0
    behind_enter_deg: 125.0
    behind_exit_deg: 70.0
    neutral_us: 1500
    level1_us: 1565
    level2_us: 1575
    level3_us: 1650
    reach_radius_m: 2.0
    approach_slow_radius_m: 8.0

thruster_node:
  ros__parameters:
    port: /dev/mtr_esp32
    baud: 115200
    command_topic: thrusters/command
    status_topic: thrusters/status
    send_rate_hz: 20.0
    command_timeout_s: 0.5
    neutral_us: 1500
    hard_min_us: 1350
    hard_max_us: 2000
    require_dual_firmware: true
