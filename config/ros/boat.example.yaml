gnss_node:
  ros__parameters:
    port: /dev/ttyACM2
    baud: 38400
    frame_id: gnss_link
    topic: gnss/fix
    poll_hz: 20.0
    serial_timeout_s: 0.05

imu_node:
  ros__parameters:
    bus: 2
    address: "0x68"
    frame_id: imu_link
    topic: imu/data_raw
    publish_rate_hz: 50.0
    calibrate_on_start: true
    calibration_samples: 200
    calibration_delay_s: 0.01

seyond_pointcloud_node:
  ros__parameters:
    lidar_ip: "172.168.1.10"
    lidar_port: 8010
    udp_port: 8010
    frame_id: "lidar_link"
    min_range: 0.15
    max_range: 50.0
    publish_second_return: true
